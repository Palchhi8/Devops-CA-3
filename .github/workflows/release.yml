name: Release Pipeline

on:
  push:
    branches:
      - main
      - 'investigation/**'
      - 'release/**'
  workflow_dispatch:

jobs:
  validate-release:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --prefix app

      - name: Run Validation Tests
        run: |
          echo "=========================================="
          echo "Running pre-deployment validation tests..."
          echo "=========================================="
          npm test --prefix app

      - name: Validate Release Artifacts & Secret Hygiene
        run: |
          echo "Verifying release versioning and configuration integrity..."
          if grep -rn "password123" deployment/ release/ 2>/dev/null; then
            echo "Security Error: Hardcoded passwords detected!"
            exit 1
          fi
          echo "Validation complete: application is stable and release configuration is verified."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-release
    environment: production
    env:
      RELEASE_VERSION: "v2.3.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
